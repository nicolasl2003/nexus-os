# Adresse du dépôt de paquets npk.
# 10.0.2.2 = la machine hôte vue depuis QEMU (servi par 'make run').
# Pour un dépôt permanent, crée /usr/local/etc/npk/repo.conf (persistant).
REPO_URL="http://10.0.2.2:8080"

# Les dépôts doivent être signés (INDEX.minisig) par une clé de confiance :
#   /etc/npk/keys/*.pub             clé officielle de Nexus OS (système de base)
#   /usr/local/etc/npk/keys/*.pub   clés supplémentaires ajoutées par root
# Pour un dépôt de test non signé (DANGEREUX), décommente :
# ALLOW_UNSIGNED=yes
