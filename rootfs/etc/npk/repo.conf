# Dépôts de paquets npk, essayés dans l'ordre (le premier qui répond avec un
# index bien signé est retenu) :
#   http://10.0.2.2:8080                        le Mac, pendant 'make run-native'
#   https://nicolasl2003.github.io/nexus-paquets     le dépôt en ligne (GitHub Pages)
# Pour changer : crée /usr/local/etc/npk/repo.conf (persistant), par exemple
#   REPO_URLS="https://mon-site.example/nexus"
REPO_URLS="http://10.0.2.2:8080 https://nicolasl2003.github.io/nexus-paquets"

# Les dépôts doivent être signés (INDEX.minisig) par une clé de confiance :
#   /etc/npk/keys/*.pub             clé officielle de Nexus OS (système de base)
#   /usr/local/etc/npk/keys/*.pub   clés supplémentaires ajoutées par root
# Pour un dépôt de test non signé (DANGEREUX), décommente :
# ALLOW_UNSIGNED=yes
