# Réglages de sécurité du noyau, appliqués au démarrage (rcS : sysctl -p)

# Cacher les adresses internes du noyau et son journal aux comptes ordinaires
# (elles aident à exploiter une faille)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# Yama : un programme ne peut espionner (ptrace) que ses propres enfants
kernel.yama.ptrace_scope = 1
# Pas de fichier « core » pour les programmes setuid (il pourrait contenir
# des mots de passe)
fs.suid_dumpable = 0
# Liens et fichiers piégés dans /tmp : protections classiques
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Adresses de chargement aléatoires (ASLR) au maximum
kernel.randomize_va_space = 2

# Réseau : refuser les redirections et le routage source, filtrer les
# adresses usurpées, résister aux attaques SYN
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
