# Construit l'ISO de Nexus OS à chaque push, sur les serveurs de GitHub.
# L'ISO est à télécharger dans l'onglet « Actions » → le build → « Artifacts ».
#
# Mêmes étapes que sur le Mac (images Docker Dockerfile et Dockerfile.gui),
# mais build/ est un dossier du dépôt (et non un volume Docker), pour pouvoir
# garder la pile graphique en cache d'un build à l'autre.
#
# Clé de signature (facultatif) : mets le contenu de keys/nexus-npk.key dans
# le secret NPK_SIGNING_KEY (Settings → Secrets and variables → Actions).
# Sans ce secret, le build génère une clé locale, comme sur une machine neuve.
name: ISO

on:
  push:
  workflow_dispatch:

# Un nouveau push sur la même branche annule le build en cours
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

# Écriture dans le dépôt : nécessaire pour créer la Release
permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILDER: docker run --rm -v ${{ github.workspace }}:/work nexus-os-builder
      GUI_BUILDER: docker run --rm -v ${{ github.workspace }}:/work nexus-os-gui-builder

    steps:
      - uses: actions/checkout@v4

      # La machine de GitHub n'a qu'environ 14 Go libres : on retire des
      # outils préinstallés inutiles ici (Android, .NET, Haskell…)
      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Version de Nexus OS
        id: version
        run: |
          . config/versions.env
          echo "nexus=$NEXUS_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Images Docker de build
        run: |
          docker build -t nexus-os-builder .
          docker build -f Dockerfile.gui -t nexus-os-gui-builder .

      # Pile graphique (Wayland, cryptsetup…) : la partie la plus longue.
      # Gardée en cache tant que build-gui.sh et Dockerfile.gui ne changent pas ;
      # les fichiers .done permettent à build-gui.sh de sauter ce qui est fait.
      - name: Cache de la pile graphique
        id: gui-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/gui/sysroot
            build/gui/build/*.done
          key: gui-${{ hashFiles('scripts/build-gui.sh', 'Dockerfile.gui') }}

      - name: Clé de signature des paquets
        env:
          NPK_SIGNING_KEY: ${{ secrets.NPK_SIGNING_KEY }}
        run: |
          if [ -n "$NPK_SIGNING_KEY" ]; then
            printf '%s\n' "$NPK_SIGNING_KEY" > keys/nexus-npk.key
            chmod 600 keys/nexus-npk.key
            echo "Clé officielle chargée depuis le secret NPK_SIGNING_KEY"
          else
            echo "::notice::Pas de secret NPK_SIGNING_KEY : une clé locale sera générée"
          fi

      - name: Pile graphique (make gui-stack)
        run: |
          $GUI_BUILDER ./scripts/build-gui.sh
          sudo chown -R "$(id -u):$(id -g)" build/gui

      # Sauvegardé tout de suite : même si une étape suivante échoue, le
      # prochain build n'aura pas à recompiler la pile graphique
      - name: Sauvegarde de la pile graphique
        if: steps.gui-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/gui/sysroot
            build/gui/build/*.done
          key: ${{ steps.gui-cache.outputs.cache-primary-key }}

      - name: Programmes du bureau (make desktop-apps)
        run: $GUI_BUILDER ./scripts/build-desktop.sh

      # Noyau : on garde l'arbre des sources AVEC les fichiers compilés (.o).
      # Si rien n'a changé (même clé), make ne recompile rien. Si
      # kernel.fragment, le logo ou build-kernel.sh ont changé, on repart du
      # dernier arbre en cache (restore-keys) : make ne recompile que ce que
      # les options modifiées touchent, au lieu de tout le noyau.
      - name: Cache du noyau
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: build/src/linux-${{ steps.version.outputs.kernel }}
          key: kernel-${{ steps.version.outputs.kernel }}-${{ hashFiles('scripts/build-kernel.sh', 'config/kernel.fragment', 'config/logo/**', 'Dockerfile') }}
          restore-keys: kernel-${{ steps.version.outputs.kernel }}-

      - name: Noyau (make kernel)
        run: |
          $BUILDER ./scripts/build-kernel.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Sauvegarde du noyau
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/src/linux-${{ steps.version.outputs.kernel }}
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: BusyBox (make busybox)
        run: $BUILDER ./scripts/build-busybox.sh

      # Outils (musl, libsodium, minisign) : ne changent qu'avec leurs versions
      - name: Cache des outils
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: build/tools
          key: tools-${{ hashFiles('config/versions.env', 'scripts/common.sh', 'scripts/build-minisign.sh', 'Dockerfile') }}

      - name: minisign et clés (make tools keys)
        run: |
          $BUILDER ./scripts/build-minisign.sh
          $BUILDER ./scripts/make-keys.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Sauvegarde des outils
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/tools
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      # Paquets : build-packages.sh saute ceux dont le .npk existe déjà. Le
      # cache n'est réutilisé que si RIEN de ce qui entre dans un paquet n'a
      # changé (recettes, bureau, pile graphique, noyau pour linux-wifi…) :
      # sinon tous les paquets sont reconstruits, pour ne jamais embarquer
      # un paquet périmé. L'INDEX est de toute façon régénéré et re-signé.
      - name: Cache des paquets
        id: packages-cache
        uses: actions/cache/restore@v4
        with:
          path: build/repo/*.npk
          key: packages-${{ hashFiles('packages/**', 'desktop/**', 'scripts/build-packages.sh', 'scripts/build-desktop.sh', 'scripts/build-gui.sh', 'scripts/build-kernel.sh', 'scripts/common.sh', 'config/kernel.fragment', 'config/versions.env', 'Dockerfile', 'Dockerfile.gui') }}

      - name: Paquets npk (make packages)
        run: |
          $BUILDER ./scripts/build-packages.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Sauvegarde des paquets
        if: steps.packages-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/repo/*.npk
          key: ${{ steps.packages-cache.outputs.cache-primary-key }}

      - name: Système (make rootfs)
        run: $BUILDER ./scripts/build-rootfs.sh

      - name: ISO (make iso)
        run: $BUILDER ./scripts/build-iso.sh

      - name: Envoi de l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-${{ steps.version.outputs.nexus }}-${{ github.sha }}
          path: build/out/nexus-os-*.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # Release « dernière version » (branche main seulement) : remplacée à
      # chaque push, ISO en téléchargement direct, sans date d'expiration
      - name: Release « dernière version »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.nexus }}
        run: |
          gh release delete derniere-version --cleanup-tag --yes || true
          gh release create derniere-version build/out/nexus-os-*.iso \
            --target "$GITHUB_SHA" --prerelease \
            --title "Nexus OS $VERSION (dernière version)" \
            --notes "ISO construite automatiquement depuis le commit $GITHUB_SHA de la branche main.

          Démarre en BIOS et en UEFI. Remplacée à chaque push : ce n'est pas une version stable."

      # Efface la clé secrète du disque de la machine (Docker l'a écrite en root)
      - name: Nettoyage
        if: always()
        run: sudo rm -f keys/nexus-npk.key
