# Menu de démarrage GRUB de Nexus OS
set timeout=5
set default=0

# Console série + écran : l'ISO marche dans QEMU -nographic et sur un vrai PC
serial --unit=0 --speed=115200
terminal_input  console serial
terminal_output console serial

menuentry "Nexus OS @VERSION@" {
    linux  /boot/bzImage console=tty0 console=ttyS0 quiet loglevel=5 fbcon=logo-count:1
    initrd /boot/initramfs.cpio.gz
}

menuentry "Nexus OS @VERSION@ (mode verbeux)" {
    linux  /boot/bzImage console=tty0 console=ttyS0 loglevel=7 fbcon=logo-count:1
    initrd /boot/initramfs.cpio.gz
}

menuentry "Redemarrer" {
    reboot
}
